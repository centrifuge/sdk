# Build and test
name: Build, Test, and Report

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  # The job name is a required check on main; keep it.
  build-n-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Installs @centrifuge/addressbook from GitHub Packages. Pull requests from forks get no
      # package access, so their install fails; SDK code changes do not come from forks.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Shared with publish-release.yml, so the registry and auth setup cannot drift between them.
      - name: Install
        uses: ./.github/actions/install
        with:
          token: ${{ github.token }}
          cache: 'true'

      # build:publish builds @centrifuge/protocol and @centrifuge/queries first, which test:unit reads
      # from their dist/.
      - name: Build the publish artifact
        run: pnpm build:publish

      - name: Verify the artifact from a clean consumer
        run: pnpm verify:publish

      - name: Unit tests
        run: pnpm test:unit

      # Fork and integration tests need a Tenderly fork or a local Anvil and are not run in CI.
