name: NPM publish

# Stages @centrifuge/sdk on npm when main carries a version that is not on npm yet. The code
# arrives through the mirror pull request from the private monorepo; merging it is the only
# human step here. A staged version is not installable until an npm maintainer approves it
# with 2FA, so nothing this workflow does reaches consumers on its own.

on:
  push:
    branches: [main]
    paths:
      - packages/sdk/package.json
  workflow_dispatch:

# A stage is never cancelled half way.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Installs @centrifuge/addressbook from GitHub Packages.
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - name: Verify running from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::Releases stage from main only (got ${REF})."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Published: stop. Not on npm (E404): stage it. Anything else, such as a registry
      # outage: fail rather than guess.
      - name: Check whether the version is already on npm
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if OUT=$(npm view "@centrifuge/sdk@${VERSION}" version --registry https://registry.npmjs.org/ 2>&1); then
            echo "::notice::@centrifuge/sdk@${VERSION} is already on npm; nothing to stage."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "${OUT}" | grep -q 'E404'; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${OUT}"
            echo "::error::Could not tell whether @centrifuge/sdk@${VERSION} is on npm."
            exit 1
          fi

      - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0
        if: steps.version.outputs.new == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.version.outputs.new == 'true'
        with:
          node-version: 22

      - name: Install, build and verify
        if: steps.version.outputs.new == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # npm expands ${NODE_AUTH_TOKEN} itself
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
          pnpm install --frozen-lockfile
          pnpm build:publish
          pnpm verify:publish

      # This tarball is what gets staged. Nothing is rebuilt after this.
      - name: Pack the tarball
        if: steps.version.outputs.new == 'true'
        working-directory: packages/sdk/dist-publish
        run: |
          set -euo pipefail
          PACKED="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n1)"
          mv "$RUNNER_TEMP/$PACKED" "$RUNNER_TEMP/sdk.tgz"
          sha256sum "$RUNNER_TEMP/sdk.tgz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.new == 'true'
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/sdk.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage on npm
    needs: build
    if: needs.build.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The package's trusted publisher on npmjs names this workflow file and this environment; a job
    # outside them gets no token.
    environment: release
    permissions:
      id-token: write
    # No checkout and no install: this job sees the tarball and nothing else.
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-tarball

      # The trusted publisher may only stage. Provenance is attached at stage time and carries
      # over on approval.
      - name: Stage
        run: npm stage publish sdk.tgz --provenance --access public --ignore-scripts

      - name: Say how to approve it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "### @centrifuge/sdk@${VERSION} is staged"
            echo "Not installable until a maintainer approves it with 2FA: npmjs.com, the package's Staged Packages tab,"
            echo "or \`npm stage list @centrifuge/sdk\` then \`npm stage approve <stage-id>\`. After approval, check its provenance:"
            echo "\`npm view @centrifuge/sdk@${VERSION} dist.attestations.provenance.predicateType\`."
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag the staged commit
    needs: [build, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A re-run finds the tag already there.
      - name: Push tag v<version>
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::notice::${TAG} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "@centrifuge/sdk ${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
