name: NPM publish
on:
  release:
    types: [released]
jobs:
  publish:
    runs-on: ubuntu-latest
    # The package's trusted publisher on npmjs names this workflow file and this environment; a job
    # outside them gets no token.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # A release can tag any commit; only one on main is staged.
      - name: Check the release commit is on main and the tag names the package version
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name version ${VERSION}: expected v${VERSION}" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing needs npm 11.15.0 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1

      - name: Enable Corepack and Set pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.10.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

      # The trusted publisher may only stage: a staged version is not installable until a maintainer
      # approves it with 2FA, so nothing this job does reaches consumers on its own. Provenance is
      # attached at stage time and carries over on approval.
      - name: Stage
        run: npm stage publish --provenance --access public

      - name: Say how to approve it
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "### ${NAME}@${VERSION} is staged"
            echo "Not installable until a maintainer approves it with 2FA: npmjs.com, the package's Staged Packages tab,"
            echo "or \`npm stage list ${NAME}\` then \`npm stage approve <stage-id>\`. After approval, check its provenance:"
            echo "\`npm view ${NAME}@${VERSION} dist.attestations.provenance.predicateType\`."
          } >> "$GITHUB_STEP_SUMMARY"
