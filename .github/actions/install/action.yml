name: Install the workspace
description: >-
  pnpm and Node 22, then a frozen install that reads @centrifuge/addressbook from GitHub Packages.
  The token is set only for the install, so the build, verify and test steps after it cannot read it.

inputs:
  token:
    description: A token with packages:read on the address book; the job's GITHUB_TOKEN.
    required: true
  cache:
    description: "'true' caches the pnpm store. Release builds leave it off and install from the registry."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}

    - name: Install
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        # The line names the variable, not the token; it resolves only while NODE_AUTH_TOKEN is set.
        # shellcheck disable=SC2016 # npm expands ${NODE_AUTH_TOKEN} itself
        echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
        pnpm install --frozen-lockfile
