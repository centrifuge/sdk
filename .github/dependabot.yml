version: 2

updates:
  # npm dependencies are managed in the private monorepo and arrive through the mirror.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      timezone: 'Europe/Berlin'

    open-pull-requests-limit: 1

    labels: []

    groups:
      github-actions-updates:
        patterns:
          - '*'
